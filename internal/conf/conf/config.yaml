# Embedded defaults. External YAML only needs to include overridden values.
server:
  addr: ":8080"
auth:
  jwt_secret: "aiops-jwt-secret-key-2024"
database:
  dsn: "data/aiops.db"

log:
  level: "info"
  format: "text"
  file: "" # Optional file path; records are also written to the console.

# 全局邮件发信配置；通知对象页面只配置收件人。
# host 留空时不启用邮件发送。账号通常为完整邮箱，password 填 SMTP 授权码。
smtp:
  host: ""
  port: 465
  security: "tls" # tls: SSL/TLS（465）；starttls: STARTTLS（587）；none: 内部无认证中继
  username: ""
  password: "" # 可使用 APP_SMTP_PASSWORD 环境变量覆盖
  from: "" # 发件人邮箱
